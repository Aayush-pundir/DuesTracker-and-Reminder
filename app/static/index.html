<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dues Control Room</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--brand:#4f46e5;--ok:#059669;--warn:#b45309;--bad:#dc2626;--soft:#eef2ff}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141b2f;--ink:#e5e9f5;--mute:#93a0bd;--line:#26304a;--brand:#818cf8;--soft:#1c2547;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
h1{font-size:16px;margin:0}h2{margin:0 0 6px}h3{margin:0 0 10px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
nav{display:flex;gap:2px;flex-wrap:wrap}nav button{border:0;background:none;padding:7px 11px;border-radius:8px;color:var(--mute);cursor:pointer;font:inherit}nav button.on{background:var(--brand);color:#fff}
main{padding:18px;max-width:1320px;margin:auto}.grid{display:grid;gap:14px;align-items:start}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid>.card{margin:0}
.kpi b{display:block;font-size:25px}.kpi span{color:var(--mute);font-size:12px}.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12px;white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}.scroll{overflow:auto;max-height:70vh}
.bar{height:9px;border-radius:5px;background:var(--brand);min-width:2px}.row{display:flex;align-items:center;gap:8px;margin:5px 0}.row .l{width:130px;color:var(--mute);font-size:12px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .v{width:88px;text-align:right;font-variant-numeric:tabular-nums;flex:none;font-size:12px}.row .t{flex:1}
button.b,input,select,textarea{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button.b{cursor:pointer}button.b:hover{background:var(--soft)}button.p{background:var(--brand);color:#fff;border-color:var(--brand)}button.p:hover{opacity:.9;background:var(--brand)}button.d{color:var(--bad)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.terms{background:var(--soft);color:var(--brand);border-color:var(--brand);font-weight:600}.tag.terms.x{color:var(--warn);border-color:var(--warn)}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.mute{color:var(--mute)}.small{font-size:12px}label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}label.f input,label.f select,label.f textarea{color:var(--ink);font-size:14px}
#drawer{position:fixed;top:0;right:0;width:min(760px,100%);height:100%;background:var(--card);border-left:1px solid var(--line);padding:18px;overflow:auto;transform:translateX(100%);transition:.2s;z-index:10;box-shadow:-8px 0 30px #0003}#drawer.open{transform:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;display:none;z-index:30;max-width:90vw}
.res{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;background:var(--soft)}.res .e{color:var(--bad)}
.empty{text-align:center;padding:36px 12px}.empty button{margin:6px}.sec{margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px}.pv{border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:8px;background:#fff;color:#111}
a{color:var(--brand)}
</style></head><body>
<header><h1>Dues Control Room</h1><nav id="nav"></nav><span style="flex:1"></span><span id="mode" class="tag"></span></header>
<main id="main"></main><aside id="drawer"></aside><div id="toast"></div><datalist id="dl"></datalist>
<script>
const $=s=>document.querySelector(s),inr=n=>(n<0?'-':'')+'₹'+Math.round(Math.abs(n||0)).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4200)};
async function api(p,o={}){const fd=o.body instanceof FormData;const r=await fetch('/api'+p,fd?o:{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)});
 if(!r.ok){const j=await r.json().catch(()=>({}));toast(typeof j.detail=='string'?j.detail:r.statusText);throw new Error('api')}return r.headers.get('content-type')?.includes('json')?r.json():r}
const today=()=>new Date().toISOString().slice(0,10);
const tabs={today:'Today',overview:'Overview',customers:'Customers',invoices:'Invoices',collect:'Collections',remind:'Reminders',resellers:'Resellers',admin:'Admin'};let cur='today',SUM={};
$('#nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-k="${k}">${v}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.k)go(e.target.dataset.k)};
async function go(k){cur=k;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));SUM=await api('/summary');
 $('#mode').textContent=(SUM.is_demo?'DEMO DATA · ':'')+'Reminders: '+SUM.send_mode;$('#mode').className='tag '+(SUM.is_demo?'warn':SUM.send_mode=='LIVE'?'ok':'');
 if(SUM.empty&&k!='admin')return emptyState();await views[k]()}
const bars=(a,max)=>{max=max||Math.max(1,...a.map(x=>x.amount));return a.map(x=>`<div class="row"><span class="l" title="${esc(x.name)}">${esc(x.name)}</span><span class="t"><div class="bar" style="width:${100*x.amount/max}%"></div></span><span class="v">${inr(x.amount)}</span></div>`).join('')};
const terms=(d)=>`<span class="tag terms ${d!=15?'x':''}">Net ${d}</span>`;
function emptyState(){$('#main').innerHTML=`<div class="card empty"><h2>Welcome 👋 — the book is empty</h2><p class="mute">Pick how to start. Everything afterwards is edited here; Excel is only needed for bulk uploads.</p>
<button class="b p" onclick="loadDemo()">Explore with demo data</button><button class="b" onclick="go('admin')">Migrate my Excel files (one time)</button><button class="b" onclick="newCustomer()">Add first customer manually</button></div>`}
async function loadDemo(){toast('Building demo…');await api('/demo/load',{method:'POST'});go('today')}
// ---------- upload flow: validate -> apply
function uploader(id,ep,extra=''){return `<div id="${id}"><div class="bar2"><input type="file" accept=".xlsx,.xlsm,.csv"><button class="b" onclick="upl('${id}','${ep}',false)">1 · Validate</button><button class="b p" onclick="upl('${id}','${ep}',true)">2 · Apply</button>${extra}</div><div class="res" style="display:none"></div></div>`}
async function upl(id,ep,apply){const box=$('#'+id),f=box.querySelector('input[type=file]').files[0];if(!f)return toast('Choose a file first');
 const fd=new FormData();fd.append('file',f);const rw=box.querySelector('input[type=checkbox]');const q=new URLSearchParams({apply});if(rw&&rw.checked)q.set('reduce_wallet',true);
 const r=await api(ep+'?'+q,{method:'POST',body:fd}),el=box.querySelector('.res');el.style.display='block';
 el.innerHTML=r.errors||r.ok!==undefined?`<b>${apply?'Applied':'Valid'}: ${r.ok} rows</b>${r.total?' · '+inr(r.total):''}${(r.errors||[]).length?`<div class="e">${r.errors.length} problem rows (skipped):<br>${r.errors.slice(0,12).map(esc).join('<br>')}</div>`:''}<div class="mute small">${(r.preview||[]).slice(0,6).map(esc).join(' · ')}</div>${apply?'':'<div class="small">Nothing saved yet — press Apply to commit the valid rows.</div>'}`:`<b>Done</b> ${esc(JSON.stringify(r))}`;
 if(apply){toast('Applied');}}
const tmplLinks=k=>`<a href="/api/templates/${k}.xlsx">⬇ Excel template</a>`;
// ---------- views
const views={
async today(){const t=await api('/today');const n=(a)=>a.length;
 const tbl=(rows,cols)=>`<table>${rows.map(r=>`<tr class="click" onclick="openC(${r.id||r.customer_id})">${cols(r)}</tr>`).join('')}</table>`;
 $('#main').innerHTML=`<div class="grid g4"><div class="card kpi"><span>Auto-pilot: reminders queued</span><b>${t.n_remind}</b><span>next run 09:30 · mode ${SUM.send_mode}</span></div>
 <div class="card kpi ${n(t.broken_promises)?'bad':''}"><span>Broken promises</span><b>${n(t.broken_promises)}</b><span>promised date passed, still unpaid</span></div>
 <div class="card kpi"><span>Bank credits to review</span><b>${SUM.bank_to_review}</b><span><a href="#" onclick="go('collect');return false">open queue →</a></span></div>
 <div class="card kpi"><span>Disputed invoices</span><b>${n(t.disputes)}</b><span>excluded from reminders</span></div></div>
 ${(t.held.n||(t.deduction_age_days===null||t.deduction_age_days>15))?`<div class="grid g2" style="margin-top:14px">${t.held.n?`<div class="card" style="border-color:var(--warn)"><h3>⏸ ${t.held.n} invoices on hold · ${inr(t.held.amt)}</h3><p class="small mute">Imported from Zoho but not yet reconciled — reminders are paused for them so nobody is chased for money already received. Upload the bank / deduction files, then release.</p><button class="b p" onclick="go('collect')">Upload collections</button> <button class="b" onclick="relHeld()">Release all held invoices</button></div>`:''}${(t.deduction_age_days===null||t.deduction_age_days>15)?`<div class="card" style="border-color:var(--warn)"><h3>🔁 Platform deductions file</h3><p class="small mute">${t.last_deduction?`Last deduction recorded <b>${t.deduction_age_days} days ago</b> (${t.last_deduction}).`:'No deductions recorded yet.'} Upload the latest deduction file so dues settled from held balances are closed before reminders go out.</p><button class="b p" onclick="go('collect')">Upload deductions</button></div>`:''}</div>`:''}
 <div class="grid g2" style="margin-top:14px">
 <div class="card"><h3>📞 Broken promises — call these</h3>${n(t.broken_promises)?tbl(t.broken_promises,r=>`<td>${esc(r.name)}<div class="mute small">${esc(r.promise_note||'')}</div></td><td>${esc(r.kam)}</td><td>promised ${r.promise_date}</td><td class="n">${inr(r.due)}</td>`):'<span class="mute">None 🎉</span>'}</div>
 <div class="card"><h3>🤝 Promises due in 3 days</h3>${n(t.promises_soon)?tbl(t.promises_soon,r=>`<td>${esc(r.name)}</td><td>${r.promise_date}</td><td class="n">${inr(r.promise_amount||r.due)}</td>`):'<span class="mute">None</span>'}</div>
 <div class="card"><h3>✉️ Next automatic reminders (largest first)</h3>${t.to_remind.length?`<table>${t.to_remind.slice(0,8).map(p=>`<tr><td>${esc(p.name)} ${p.kind=='RESELLER'?'<span class="tag warn">reseller</span>':''}</td><td>stage ${p.stage}</td><td>${p.channels.join('+')}</td><td class="n">${inr(p.total)}</td></tr>`).join('')}</table><div class="small mute" style="margin-top:6px">…${t.n_remind} in total · <a href="#" onclick="go('remind');return false">review plan</a></div>`:'<span class="mute">Nothing to send today.</span>'}</div>
 <div class="card"><h3>⚖️ Disputed invoices</h3>${n(t.disputes)?tbl(t.disputes,r=>`<td>${esc(r.name)} ${esc(r.invoice_no)}</td><td>${esc(r.dispute_note)}</td><td class="n">${inr(r.bal)}</td>`):'<span class="mute">None</span>'}</div>
 <div class="card"><h3>🏦 Reseller customers: split % for NEW invoices</h3><p class="mute small">Old dues already carry their split. For new invoices set the % the reseller pays (rest is the customer's).</p>${n(t.reseller_no_split)?`<table>${t.reseller_no_split.map(r=>`<tr><td>${esc(r.name)}</td><td class="mute">${esc(r.reseller)}</td><td><input type="number" id="sp${r.id}" min="0" max="100" placeholder="%" style="width:70px"> <button class="b" onclick="setSplit(${r.id})">Save</button></td></tr>`).join('')}</table>`:'<span class="mute">All set</span>'}</div>
 <div class="card"><h3>📭 Customers with dues but no contact</h3>${n(t.no_contact)?tbl(t.no_contact,r=>`<td>${esc(r.name)}</td><td>${esc(r.kam)}</td><td class="n">${inr(r.due)}</td>`):'<span class="mute">All reachable</span>'}</div></div>`},
async overview(){const s=SUM;
 $('#main').innerHTML=`<div class="grid g4"><div class="card kpi"><span>Total outstanding</span><b>${inr(s.total)}</b><span>${s.customers_with_dues} customers</span></div>
 <div class="card kpi bad"><span>Overdue</span><b>${inr(s.overdue)}</b><span>${Math.round(100*s.overdue/(s.total||1))}% of total</span></div>
 <div class="card kpi"><span>DSO (days sales outstanding)</span><b>${s.dso??'—'}</b><span>outstanding ÷ last-90-day billing × 90</span></div>
 <div class="card kpi ok"><span>Collected this month</span><b>${inr(s.collected_this_month.reduce((a,x)=>a+x.amount,0))}</b><span>${s.collected_this_month.map(x=>x.mode.toLowerCase().replace('_',' ')+' '+inr(x.amount)).join(' · ')||'—'}</span></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Ageing (days past due date)</h3>${bars(s.aging)}</div>
 <div class="card"><h3>Who owes it</h3>${bars(s.by_payer)}<h3 style="margin-top:14px">By KAM</h3>${bars(s.by_kam)}</div>
 <div class="card"><h3>Top 10 debtors</h3>${s.top.map(t=>`<div class="row" style="cursor:pointer" onclick="openC(${t.id})"><span class="l" style="width:250px">${esc(t.name)}</span><span class="v" style="flex:1;text-align:right">${inr(t.amount)}</span></div>`).join('')}</div>
 <div class="card"><h3>By collection route</h3>${bars(s.by_mode)}<h3 style="margin-top:14px">By invoice type</h3>${bars(s.by_kind)}<h3 style="margin-top:14px">Money held on platform</h3><b>${inr(s.wallet_held)}</b></div></div>`},
async customers(){const rs=await api('/resellers');
 $('#main').innerHTML=`<div class="bar2"><input id="q" placeholder="Search customer…"><select id="kam"><option value="">All KAMs</option>${SUM.by_kam.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select><select id="rs"><option value="0">All resellers</option>${rs.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><label class="small"><input type="checkbox" id="all"> include zero-balance</label><span class="mute" id="cnt"></span><span style="flex:1"></span><button class="b p" onclick="newCustomer()">+ Customer</button></div>
 <div class="card scroll" style="padding:0"><table><thead><tr><th>Customer</th><th>KAM</th><th>Terms</th><th>Reseller / share</th><th class="n">Customer owes</th><th class="n">Reseller owes</th><th class="n">Overdue</th><th>Oldest due</th><th>Promise</th><th>Last reminder</th></tr></thead><tbody id="tb"></tbody></table></div>`;
 const load=async()=>{const l=await api(`/customers?q=${encodeURIComponent($('#q').value)}&kam=${encodeURIComponent($('#kam').value)}&reseller_id=${$('#rs').value}&status=${$('#all').checked?'all':'dues'}`);$('#cnt').textContent=l.length+' customers';
  $('#tb').innerHTML=l.map(c=>`<tr class="click" onclick="openC(${c.id})"><td>${esc(c.name)}${c.status!='ACTIVE'?` <span class="tag bad">${c.status}</span>`:''}</td><td>${esc(c.kam)}</td><td>${terms(c.credit_days)}</td><td>${c.reseller?esc(c.reseller)+` <span class="tag">${c.reseller_share_pct||0}%</span>`:''}</td><td class="n">${inr(c.due_customer)}</td><td class="n">${c.due_reseller?inr(c.due_reseller):''}</td><td class="n" style="color:var(--bad)">${c.overdue?inr(c.overdue):''}</td><td>${c.oldest_due||''}</td><td>${c.promise_date?`<span class="tag ${c.promise_date<today()?'bad':'warn'}">${c.promise_date}</span>`:''}</td><td class="small">${c.last_reminder||'<span class=mute>never</span>'}</td></tr>`).join('')};
 ['q','kam','rs','all'].forEach(i=>$('#'+i).oninput=load);load()},
async invoices(){
 $('#main').innerHTML=`<div class="grid g2"><div class="card"><h3>New invoice (single)</h3>${invoiceForm()}</div>
 <div class="card"><h3>Bulk add / update / cancel invoices</h3><p class="mute small">${tmplLinks('invoices')} · ADD, UPDATE or CANCEL per row. Validate first — nothing is saved until Apply.</p>${uploader('ui','/upload/invoices')}
 <h3 style="margin-top:16px">Fetch new invoices from Zoho Books</h3><div class="bar2"><label class="f">From<input type="date" id="zs"></label><label class="f">To<input type="date" id="ze" value="${today()}"></label><button class="b" onclick="zPreview()">Preview</button><button class="b p" onclick="zImport()">Import</button></div>
 <label class="small"><input type="checkbox" id="zp" checked> invoices Zoho shows as paid → import already closed</label> <label class="small"><input type="checkbox" id="zc" checked> create unknown customers</label> <label class="small"><input type="checkbox" id="zh" checked> hold open invoices until reconciled</label>
 <div style="margin-top:10px"><span class="small mute">No API access yet? In Zoho Books: Invoices → Export → CSV/XLSX, then upload it here.</span>${uploader('uz','/zoho/file')}</div>
 <p class="mute small">Zoho is only a source of <b>new</b> invoices. Open ones are never trusted as "paid" — they are closed here through collections.</p><div id="zres" class="res" style="display:none"></div></div></div>
 <div class="bar2"><input id="iq" placeholder="Search customer / invoice no…"><button class="b" onclick="relHeld()" title="Releases every invoice currently on hold">Release held invoices</button><select id="is"><option value="">All status</option><option value="overdue">Overdue</option><option value="held">On hold</option><option>OPEN</option><option>PARTIAL</option><option>CLOSED</option><option>CANCELLED</option></select><select id="ip"><option value="">Both payers</option><option value="CUSTOMER">Customer share</option><option value="RESELLER">Reseller share</option></select><input type="date" id="if"><input type="date" id="it"><span class="mute" id="icnt"></span></div>
 <div class="card scroll" style="padding:0"><table><thead><tr><th>Date</th><th>Customer</th><th>Invoice</th><th>Payer</th><th>Terms</th><th>Due</th><th class="n">Amount</th><th class="n">Balance</th><th>Status</th><th></th></tr></thead><tbody id="itb"></tbody></table></div>`;
 wireInvoiceForm();const load=async()=>{const l=await api(`/invoices?q=${encodeURIComponent($('#iq').value)}&status=${$('#is').value}&payer=${$('#ip').value}&date_from=${$('#if').value}&date_to=${$('#it').value}`);$('#icnt').textContent=l.length+' shown';
  $('#itb').innerHTML=l.map(i=>`<tr><td>${i.invoice_date}</td><td class="click" onclick="openC(${i.customer_id})" style="cursor:pointer">${esc(i.customer)}</td><td>${esc(i.invoice_no||i.kind)}<div class="mute small">${esc(i.description)}</div></td><td>${i.payer=='RESELLER'?'<span class="tag warn">reseller</span>':'customer'}</td><td>${terms(i.credit_days)}</td><td style="${i.status!='CLOSED'&&i.status!='CANCELLED'&&i.due_date<today()?'color:var(--bad)':''}">${i.due_date}</td><td class="n">${inr(i.amount)}</td><td class="n">${inr(i.balance)}</td><td><span class="tag ${i.status=='CLOSED'?'ok':i.status=='CANCELLED'?'':'warn'}">${i.status}</span>${i.disputed?' <span class="tag bad">dispute</span>':''}${i.hold?' <span class="tag warn" title="'+esc(i.hold_reason)+'">on hold</span>':''}</td><td>${invActions(i,'invoices')}</td></tr>`).join('')};
 ['iq','is','ip','if','it'].forEach(i=>$('#'+i).oninput=load);window._reloadInv=load;load()},
async collect(){const b=await api('/bank/review'),p=await api('/payments');
 $('#main').innerHTML=`<div class="grid g2"><div class="card"><h3>Record one collection</h3>${payForm()}</div>
 <div class="card"><h3>Bank statement (auto-match & close invoices)</h3><p class="mute small">CSV/XLSX with date, narration, credit columns. Confident matches close invoices oldest-first; the rest wait below. ${SUM.is_demo?'<a href="/api/demo/bank_sample.csv">⬇ sample statement for the demo</a>':''}</p>${uploader('ub','/upload/bank')}
 <h3 style="margin-top:16px">Platform deductions file (every 15 days / month)</h3><p class="mute small">${tmplLinks('deductions')} · balances you deducted on the ops platform. Each row settles that customer's oldest dues.</p>${uploader('ud','/upload/deductions','<label class="small"><input type="checkbox"> also reduce wallet balance</label>')}
 <h3 style="margin-top:16px">Bulk collections (Excel)</h3><p class="mute small">${tmplLinks('collections')} · bank receipts, wallet deductions, auto-debits, credit notes, TDS.</p>${uploader('uc','/upload/collections','<label class="small"><input type="checkbox"> also reduce wallet balance</label>')}</div></div>
 <div class="card"><h3>Bank credits awaiting a decision (${b.length})</h3><div class="scroll"><table><thead><tr><th>Date</th><th class="n">Amount</th><th>Narration</th><th>Suggestion</th><th></th></tr></thead><tbody>${b.map(p=>`<tr><td>${p.received_on}</td><td class="n">${inr(p.amount)}</td><td>${esc(p.narration)}</td><td>${esc(p.suggested||'—')}</td><td>${p.suggested_party?`<button class="b p" onclick="conf(${p.id},'${p.suggested_party}')">Confirm</button> `:''}<input list="dl" placeholder="assign to…" oninput="lk(this)" onchange="pick(this)" id="m${p.id}" size="16"><button class="b" onclick="assign(${p.id})">Assign</button> <button class="b d" onclick="api('/payments/${p.id}',{method:'DELETE'}).then(()=>go('collect'))">✕</button></td></tr>`).join('')||'<tr><td colspan=5 class="mute">Nothing to review 🎉</td></tr>'}</tbody></table></div></div>

async function clrPromise(id){await api(`/customers/${id}/promise`,{method:'POST',body:{}});openC(id)}
async function addNote(id){if(!v('nt_t'))return;await api(`/customers/${id}/notes`,{method:'POST',body:{text:v('nt_t'),kind:v('nt_k')}});openC(id)}
async function revC(p,id){if(confirm('Undo this receipt?')){await api(`/payments/${p}/reverse`,{method:'POST'});openC(id)}}
async function quickInv(id){const a=prompt('Invoice amount (₹)');if(!a)return;const n=prompt('Invoice no. (optional)')||'';await api('/invoices',{method:'POST',body:{customer_id:id,amount:+a,invoice_no:n,invoice_date:today()}});toast('Created');openC(id)}
async function quickPay(id){const a=prompt('Amount received (₹)');if(!a)return;const t=prompt('TDS withheld (₹)','0');const r=await api('/payments',{method:'POST',body:{party:'C:'+id,amount:+a,tds:+t||0,received_on:today()}});toast(`Settled ${inr(r.allocated)}`);openC(id)}
function newCustomer(){$('#drawer').innerHTML=`<button class="b" onclick="closeD()">Close</button><h2>New customer</h2><div class="bar2"><label class="f">Name<input id="n_name" size="34"></label><label class="f">Credit days<input type="number" id="n_cd" value="15" style="width:90px"></label></div><div class="bar2"><label class="f">KAM<input id="n_kam"></label><label class="f">E-mail<input id="n_to" size="28"></label><label class="f">WhatsApp<input id="n_wa"></label></div><button class="b p" onclick="mk()">Create</button>`;$('#drawer').classList.add('open')}
async function mk(){const r=await api('/customers',{method:'POST',body:{name:v('n_name'),credit_days:+v('n_cd'),kam:v('n_kam'),email_to:v('n_to'),whatsapp:v('n_wa')}});toast('Customer created');openC(r.id)}
async function setSplit(id){const x=+$('#sp'+id).value;if(!(x>0))return toast('Enter a % between 1 and 100');await api('/customers/'+id,{method:'PATCH',body:{reseller_share_pct:x}});toast('Saved');go('today')}
async function saveR(id){await api('/resellers/'+id,{method:'PATCH',body:{contact_emails:v('re'+id),whatsapp:v('rw'+id),remind_reseller:+$('#rr'+id).checked}});toast('Saved')}
// ---------- reminders
async function runR(m){const r=await api('/reminders/run',{method:'POST',body:{mode:m}});toast(`sent ${r.sent} · dry-run ${r.dry_run} · failed ${r.failed}`);go('remind')}
async function saveCh(){await api('/settings',{method:'PUT',body:{channel_email:$('#ce').checked?1:0,channel_whatsapp:$('#cw').checked?1:0,send_mode:$('#sm').value}});toast('Saved');go('remind')}
async function saveT(){await api('/reminders/templates/'+$('#tk').value,{method:'PUT',body:{subject:v('ts'),body:v('tbd')}});toast('Template saved');go('remind')}
async function prev(party,ch){const m=await api(`/reminders/preview?party=${encodeURIComponent(party)}&channel=${ch}`);
 $('#drawer').innerHTML=`<button class="b" onclick="closeD()">Close</button><h3 style="margin-top:12px">${ch} · stage ${m.stage}</h3><p><b>${esc(m.subject)}</b></p><p class="mute small">To: ${esc(m.to.join('; '))}<br>CC: ${esc(m.cc.join('; '))}</p><div class="pv">${ch=='EMAIL'?m.body:esc(m.body).replace(/\n/g,'<br>')}</div>`;$('#drawer').classList.add('open')}
// ---------- zoho / admin
async function zPreview(){const r=await api('/zoho/preview',{method:'POST',body:{start:v('zs'),end:v('ze')}});const c={};r.forEach(x=>c[x.import_status]=(c[x.import_status]||0)+1);const el=$('#zres');el.style.display='block';el.innerHTML=`<b>${r.length} invoices in Zoho for this period</b><br>${Object.entries(c).map(([k,n])=>`${k.replace('_',' ').toLowerCase()}: ${n}`).join(' · ')}`}
async function zImport(){if(!v('zs'))return toast('Choose the period');const r=await api('/zoho/import',{method:'POST',body:{start:v('zs'),end:v('ze'),include_paid:$('#zp').checked,create_customers:$('#zc').checked,hold_open:$('#zh').checked}});const el=$('#zres');el.style.display='block';el.innerHTML=`<b>Imported</b>: ${r.created} new (${r.held} on hold) · ${r.linked} linked to existing · ${r.closed_as_paid} closed as paid · ${r.new_customers} new customers`;toast('Zoho import done');window._reloadInv&&window._reloadInv()}
async function mig(k,id){const f=$('#'+id).files[0];if(!f)return toast('Choose the file');const fd=new FormData();fd.append('file',f);toast('Importing… (up to a minute)');const r=await api('/migration/'+k,{method:'POST',body:fd});const el=$('#mres');el.style.display='block';el.innerHTML='<b>Imported</b> '+esc(JSON.stringify(r))}
async function relHeld(){if(!confirm('Release ALL invoices currently on hold into normal reminders?'))return;const r=await api('/invoices/release',{method:'POST',body:{}});toast(r.released+' invoices released');go(cur)}
async function saveS(){const b={};document.querySelectorAll('[data-s]').forEach(i=>b[i.dataset.s]=i.value);await api('/settings',{method:'PUT',body:b});toast('Saved')}
async function tst(ch){const r=await api('/channels/test',{method:'POST',body:{channel:ch,to:v('tt')}});toast('Test sent')}
go('today');
</script></body></html>
